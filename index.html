    body:{zh:`<p>2024 年 9 月，我开始了 Terrylene-O₂ 体系的半经验量子化学计算研究。作为项目队长，我需要从零搭建一条从构型生成、批量计算到数据分析的完整工作流。</p>
<h2>为什么选择 PM7？</h2>
<p>对于 C30H16-O2 这样的中大型体系，DFT 计算成本较高。PM7 半经验方法在保持合理精度的同时，将单个构型的优化时间压缩到分钟级，使得大规模筛选成为可能。</p>
<h2>160 个构型的系统设计</h2>
<p>我们构建了 158 个对称性独立的初始位点对，覆盖 O2 分子在 Terrylene 骨架上所有可能的吸附位置。每个构型记录完整的生成参数与坐标来源，确保可追溯。</p>
<h2>质量控制：不止于"算完了"</h2>
<p>计算中最容易被忽视的是质量控制。我们建立了三层审核机制：异常几何检查、对称性重复检测、命名-坐标一致性校验。所有产物附带版本化清单与 SHA256 哈希，确保任何时候都能复现。</p>
<blockquote>科研不是一次性的计算，而是可复现、可审计的工作流。</blockquote>

    en:`<p>In September 2024, I started semi-empirical quantum chemistry calculations on the Terrylene-O₂ system. As team leader, I needed to build a complete workflow from configuration generation, batch computation, to data analysis from scratch.</p>
<h2>Why PM7?</h2>
<p>For medium-large systems like C30H16-O2, DFT is computationally expensive. PM7 semi-empirical method compresses single-configuration optimization to minutes while maintaining reasonable accuracy, enabling large-scale screening.</p>
<h2>Systematic Design of 160 Configurations</h2>
<p>We constructed 158 symmetry-independent initial site pairs, covering all possible adsorption positions of O2 on the Terrylene skeleton. Each configuration records complete generation parameters and coordinate provenance for traceability.</p>
<h2>Quality Control: Beyond "It Computed"</h2>
<p>The most overlooked part of computation is quality control. We established a three-layer audit: abnormal geometry detection, symmetry duplicate detection, and naming-coordinate consistency checks. All artifacts come with versioned manifests and SHA256 hashes for reproducibility.</p>
<blockquote>Research is not a one-time computation — it is a reproducible, auditable workflow.</blockquote>
<h2>Next Steps</h2>
<p>We have classified 65 structural basins and completed 138-mode vibrational frequency calculations. Next steps include INDO/CIS12 UV-Vis spectroscopy and validation with higher-level methods.</p>`}
